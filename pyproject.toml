[project]
name = "abc-model"
version = "0.1.0"
description = "NFL Polymarket prediction model — data gathering phase"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "nflreadpy>=0.1.4",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abcm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
